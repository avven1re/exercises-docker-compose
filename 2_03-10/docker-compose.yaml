services:
  frontend:
    build:
      context: ../example-app
      dockerfile: ../2_03-10/Dockerfile.frontend
    image: example-frontend
    ports:
      - 5001:5001
  backend:
    build:
      context: ../example-app
      dockerfile: ../2_03-10/Dockerfile.backend
    image: example-backend
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
    ports:
      - 8080:8080
